<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Militair Logboek Pro</title>
  <style>
    :root {
      --bg-color: #1e241e;
      --card-bg: #2a322a;
      --accent: #5b7052;
      --accent-hover: #4a5c42;
      --text: #e0e6df;
      --border: #3d483d;
      --danger: #8b0000;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-bottom: 90px;
    }

    h1 { text-align: center; color: #a3b899; margin-bottom: 15px; font-size: 1.5em; }

    .panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0 10px 0;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #181c18;
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.95em;
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button.btn-danger { background: var(--danger); }
    button.btn-sec { background: #3a4738; }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 5px 0 10px 0;
    }

    .tag-chip {
      background: #181c18;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      cursor: pointer;
    }

    .tag-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .item-card.nested {
      margin-left: 15px;
      border-left: 3px solid var(--accent);
    }

    .item-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 5px;
      background: #181c18;
      flex-shrink: 0;
    }

    .item-info { flex-grow: 1; }
    .item-title { font-weight: bold; font-size: 1em; }
    .item-sub { font-size: 0.8em; color: #a0a0a0; margin: 2px 0; }
    .tag { background: #3a4738; padding: 2px 6px; border-radius: 3px; font-size: 0.75em; margin-right: 4px; display: inline-block; }

    .action-btns { display: flex; gap: 5px; }
    .action-btns button { width: auto; padding: 6px 10px; margin: 0; font-size: 0.8em; }

    .checkbox-container input { width: 20px; height: 20px; }

    #batch-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111511;
      padding: 10px 15px;
      border-top: 2px solid var(--accent);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>🪖 Militair Logboek</h1>

  <div class="panel">
    <input type="text" id="search-input" placeholder="🔍 Zoek op naam, tag of inhoud..." oninput="renderItems()">
    <select id="filter-location" onchange="renderItems()">
      <option value="ALL">🌍 Alle Locaties</option>
    </select>
  </div>

  <details class="panel" id="form-panel">
    <summary><strong id="form-title">➕ Nieuw Item / Locatie Toevoegen</strong></summary>
    <br>
    <input type="hidden" id="edit-item-id" value="">

    <label>Naam item:</label>
    <input type="text" id="new-name" placeholder="bv. Rugzak 60L, Kompas, Vest">

    <label>Locatie / Waar zit het in?:</label>
    <select id="new-parent"></select>

    <label>Selecteer Trefwoorden (Klik om te kiezen):</label>
    <div class="tag-cloud" id="existing-tags-cloud"></div>

    <label>Nieuw trefwoord toevoegen:</label>
    <div style="display: flex; gap: 5px;">
      <input type="text" id="custom-tag-input" placeholder="bv. inhoud, waterdicht" style="margin:0;">
      <button type="button" onclick="addCustomTag()" style="width: auto; margin:0;">+ Tag</button>
    </div>
    <small style="color: #a0a0a0; display:block; margin-bottom: 10px;">💡 Gebruik het trefwoord <b>"inhoud"</b> om van dit item een tas/container te maken!</small>

    <label>Foto (optioneel):</label>
    <input type="file" id="new-photo" accept="image/*">

    <button type="button" id="save-btn" onclick="saveItem()">Item Opslaan</button>
    <button type="button" id="cancel-btn" class="btn-sec hidden" onclick="resetForm()">Annuleren</button>

    <hr style="border-color: var(--border); margin: 15px 0;">

    <details>
      <summary>⚙️ Locaties Beheren</summary>
      <br>
      <input type="text" id="new-location-name" placeholder="Nieuwe locatie (bv. Voertuig)">
      <button type="button" onclick="addCustomLocation()">Locatie Toevoegen</button>
      
      <label>Bestaande locatie verwijderen:</label>
      <div style="display:flex; gap:5px;">
        <select id="delete-location-select" style="margin:0;"></select>
        <button type="button" class="btn-danger" onclick="deleteLocation()" style="width:auto; margin:0;">Verwijderen</button>
      </div>
    </details>
  </details>

  <div id="item-list"></div>

  <div id="batch-bar" class="hidden">
    <span id="selected-count">0 gekozen</span>
    <select id="move-destination" style="margin:0;"></select>
    <button onclick="moveSelectedItems()" style="margin:0; width:auto;">Verplaatsen</button>
  </div>

  <script>
    let locations = JSON.parse(localStorage.getItem('mil_locations')) || ["Thuis", "Basis", "Kast A"];
    let allTags = JSON.parse(localStorage.getItem('mil_tags')) || ["inhoud", "kleding", "navigatie", "essentieel"];
    let items = JSON.parse(localStorage.getItem('mil_items')) || [];
    let selectedTagsForForm = [];

    function saveData() {
      localStorage.setItem('mil_locations', JSON.stringify(locations));
      localStorage.setItem('mil_tags', JSON.stringify(allTags));
      localStorage.setItem('mil_items', JSON.stringify(items));
    }

    function addCustomLocation() {
      const locName = document.getElementById('new-location-name').value.trim();
      if (locName && !locations.includes(locName)) {
        locations.push(locName);
        document.getElementById('new-location-name').value = '';
        saveData();
        updateUI();
      }
    }

    function deleteLocation() {
      const locToDelete = document.getElementById('delete-location-select').value;
      if (!locToDelete) return;
      
      if (confirm(`Weet je zeker dat je locatie '${locToDelete}' wilt verwijderen? Items op deze locatie worden verplaatst naar de eerste beschikbare locatie.`)) {
        locations = locations.filter(l => l !== locToDelete);
        const fallbackLoc = locations[0] || "Thuis";
        
        items.forEach(item => {
          if (item.parent === locToDelete) item.parent = fallbackLoc;
        });

        saveData();
        updateUI();
      }
    }

    function addCustomTag() {
      const input = document.getElementById('custom-tag-input');
      const tag = input.value.trim().toLowerCase();
      if (tag) {
        if (!allTags.includes(tag)) {
          allTags.push(tag);
        }
        if (!selectedTagsForForm.includes(tag)) {
          selectedTagsForForm.push(tag);
        }
        input.value = '';
        saveData();
        renderTagCloud();
      }
    }

    function toggleTagSelection(tag) {
      if (selectedTagsForForm.includes(tag)) {
        selectedTagsForForm = selectedTagsForForm.filter(t => t !== tag);
      } else {
        selectedTagsForForm.push(tag);
      }
      renderTagCloud();
    }

    function renderTagCloud() {
      const cloud = document.getElementById('existing-tags-cloud');
      cloud.innerHTML = '';
      allTags.forEach(tag => {
        const isSelected = selectedTagsForForm.includes(tag
